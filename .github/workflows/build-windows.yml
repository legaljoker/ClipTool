name: Build Windows app

# Builds ClipTool-Editor.exe (no Python needed), tests it, and publishes the
# installer + a portable zip as a GitHub release named after the version.
on:
  push:
    branches: ["claude/tiktok-youtube-video-tool-f42ftj", "main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e . pywebview pyinstaller pillow pytest
          $v = python -c "import cliptool; print(cliptool.__version__)"
          "CLIPTOOL_VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "Version $v"

      - name: Download ffmpeg (bundled with the app)
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          $bin = (Get-ChildItem ffmpeg_dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force packaging\ffmpeg | Out-Null
          Copy-Item "$bin\ffmpeg.exe", "$bin\ffprobe.exe" packaging\ffmpeg\
          $lic = Get-ChildItem ffmpeg_dl -Recurse -Filter LICENSE* | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName packaging\ffmpeg\FFMPEG-LICENSE.txt }
          & packaging\ffmpeg\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Run the tests on Windows
        continue-on-error: true
        run: |
          $env:PATH = "$PWD\packaging\ffmpeg;$env:PATH"
          python -m pytest -q -p no:cacheprovider

      - name: Build ClipTool-Editor.exe
        run: pyinstaller --noconfirm packaging\ClipTool-Editor.spec

      - name: Self-test the built program
        run: |
          $env:CLIPTOOL_HOME = "$PWD\selftest_home"
          $p = Start-Process -FilePath dist\ClipTool-Editor\ClipTool-Editor.exe -ArgumentList "--selftest", "--with-whisper" -Wait -PassThru
          Get-Content "$env:CLIPTOOL_HOME\logs\selftest.log"
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed"; exit 1 }

      - name: Typing test of the real program window (real mouse and keyboard)
        run: .\packaging\uitest.ps1 -Name typing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uitest-screenshots
          path: uitest_shots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build the installer
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$env:CLIPTOOL_VERSION" packaging\ClipTool-Editor.iss
          Compress-Archive -Path dist\ClipTool-Editor -DestinationPath "dist\ClipTool-Editor-$env:CLIPTOOL_VERSION-portable.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ClipTool-Editor-${{ env.CLIPTOOL_VERSION }}
          path: |
            dist/ClipTool-Editor-Setup-*.exe
            dist/ClipTool-Editor-*-portable.zip
          retention-days: 30

      - name: Publish release
        # add "[no release]" to a commit message to build and test without publishing
        if: ${{ !contains(github.event.head_commit.message, '[no release]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:CLIPTOOL_VERSION"
          gh release delete $tag --yes --cleanup-tag 2>$null   # replace an earlier build of the same version
          $global:LASTEXITCODE = 0
          $notes = "Download **ClipTool-Editor-Setup-$env:CLIPTOOL_VERSION.exe**, run it, and start ClipTool Editor from the Start menu or desktop. No Python or ffmpeg install needed.`n`nPortable version: unzip ClipTool-Editor-$env:CLIPTOOL_VERSION-portable.zip and run ClipTool-Editor.exe.`n`nBuilt from $env:GITHUB_SHA. See CHANGELOG.md for what's new."
          gh release create $tag "dist\ClipTool-Editor-Setup-$env:CLIPTOOL_VERSION.exe" "dist\ClipTool-Editor-$env:CLIPTOOL_VERSION-portable.zip" --target $env:GITHUB_SHA --title "ClipTool Editor $env:CLIPTOOL_VERSION" --notes $notes
